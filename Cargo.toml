[package]
name = "rustper"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
default-run = "rustper"
description = "A Kafka fan-out router: one source, many sinks, at-least-once delivery with contiguous offset commits."
repository = "https://github.com/kirilngusi/rustper"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["kafka", "clickhouse", "streaming", "router", "pipeline"]
categories = ["network-programming", "asynchronous"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.10"
clickhouse = "0.15.1"
futures = "0.3"
# Already compiled into every build as a transitive dependency of `clickhouse`;
# promoted to a direct dependency to serve the metrics endpoint.
http-body-util = "0.1"
hyper = { version = "1.11", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rdkafka = { version = "0.39", features = ["cmake-build", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
# "net" and "io-util" back the metrics listener; they were previously enabled
# only as a side effect of hyper-util turning them on.
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The hot path allocates per batch (arena chunks, librdkafka queues); the system
# allocator on glibc/macOS is the weakest link there and retains more pages.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[[bin]]
name = "kafka-load"
path = "src/bin/kafka_load.rs"

[profile.release]
# The measured numbers in docs/PERFORMANCE.md predate these settings.
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
