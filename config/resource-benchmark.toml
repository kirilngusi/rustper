[sources.kafka_in]
type = "kafka"
brokers = "localhost:9092"
group_id = "rustper-resource-benchmark-v1"
topics = ["rustper-resource-input"]
batch_size = 1000
batch_linger_ms = 5
max_in_flight_batches = 8
max_in_flight_bytes = 268435456

[sinks.output_a]
type = "kafka"
inputs = ["kafka_in"]
brokers = "localhost:9092"
topic = "rustper-resource-a"
buffer_capacity = 32
batch_max_events = 10000
batch_max_bytes = 16777216
batch_linger_ms = 5

[sinks.output_b]
type = "kafka"
inputs = ["kafka_in"]
brokers = "localhost:9092"
topic = "rustper-resource-b"
buffer_capacity = 32
batch_max_events = 10000
batch_max_bytes = 16777216
batch_linger_ms = 5
